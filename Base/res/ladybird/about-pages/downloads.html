<!doctype html>
<html lang="en">
    <head>
        <title>Downloads</title>
        <link rel="icon" type="image/png" href="resource://icons/48x48/app-browser.png" />
        <link rel="stylesheet" type="text/css" href="resource://ladybird/ladybird.css" />
        <link rel="stylesheet" type="text/css" href="resource://ladybird/about-pages/webui.css" />
        <style>
            @media (prefers-color-scheme: light) {
                :root {
                    --download-progress-color: #5c8ecc;
                    --download-progress-track-color: #dde4ec;
                    --download-status-completed-color: #1f7a3f;
                    --download-status-failed-color: #b33232;
                    --download-status-paused-color: #a06a12;
                    --download-segment-done-color: #2f5d94;
                }
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --download-progress-color: #77a1d1;
                    --download-progress-track-color: #323841;
                    --download-status-completed-color: #7bd493;
                    --download-status-failed-color: #ff8585;
                    --download-status-paused-color: #e0b169;
                    --download-segment-done-color: #b9d3f0;
                }
            }

            body {
                max-width: 1280px;
            }

            .downloads-manager {
                display: flex;
                align-items: flex-start;
                gap: 20px;
            }

            .downloads-sidebar {
                display: flex;
                flex-direction: column;
                gap: 20px;

                flex: 0 0 180px;
                min-width: 0;
            }

            .sidebar-section {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .sidebar-heading {
                margin: 0 8px 6px 8px;
                color: var(--secondary-text-color);
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            .sidebar-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;

                width: 100%;
                padding: 7px 8px;

                color: inherit;
                background: none;
                border: none;
                border-radius: 6px;

                font-size: 13px;
                text-align: left;
                cursor: pointer;
            }

            .sidebar-item:hover {
                background-color: var(--item-hover-color);
            }

            .sidebar-item.active {
                background-color: var(--item-selected-color);
                font-weight: 600;
            }

            .sidebar-count {
                color: var(--secondary-text-color);
                font-size: 12px;
            }

            .sidebar-item.active .sidebar-count {
                color: inherit;
            }

            .downloads-main {
                flex: 1 1 auto;
                min-width: 0;
            }

            .downloads-status,
            .downloads-empty {
                color: var(--secondary-text-color);
                font-size: 13px;
            }

            .downloads-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 16px;
            }

            .downloads-empty {
                padding: 36px 12px;
                text-align: center;
                font-size: 14px;
            }

            .downloads-table-wrapper {
                overflow-x: auto;
            }

            .downloads-table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }

            .downloads-table th {
                color: var(--secondary-text-color);
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                text-align: left;

                padding: 0 10px 8px 10px;
                border-bottom: 1px solid var(--separator-color);

                cursor: pointer;
                user-select: none;
                white-space: nowrap;
            }

            .downloads-table th:hover {
                color: inherit;
            }

            .downloads-table th.sorted::after {
                content: "▾";
                margin-left: 4px;
                font-size: 10px;
            }

            .downloads-table th.sorted.descending::after {
                content: "▴";
            }

            .downloads-table th.col-name {
                width: 26%;
            }

            .downloads-table th.col-size {
                width: 11%;
            }

            .downloads-table th.col-last-try,
            .downloads-table th.col-date-added {
                width: 13%;
            }

            .downloads-table th.col-location {
                width: 15%;
            }

            .downloads-table th.col-actions {
                width: 150px;
            }

            .downloads-table td {
                padding: 12px 10px;
                border-bottom: 1px solid var(--separator-color);
                vertical-align: top;

                font-size: 13px;
            }

            .downloads-table tr:last-child td {
                border-bottom: none;
            }

            .cell-text {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .download-name {
                font-weight: 600;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .download-status-line {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-top: 4px;

                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;

                font-size: 12px;
            }

            .download-status {
                font-weight: 600;
                white-space: nowrap;
            }

            .download-status.completed {
                color: var(--download-status-completed-color);
            }

            .download-status.failed {
                color: var(--download-status-failed-color);
            }

            .download-status.paused {
                color: var(--download-status-paused-color);
            }

            .download-detail {
                color: var(--secondary-text-color);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .download-progress {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-top: 8px;
            }

            .download-progress progress {
                appearance: none;
                width: 100%;
                height: 6px;
                display: block;
            }

            .download-progress progress::-webkit-progress-bar {
                background-color: var(--download-progress-track-color);
                border-radius: 999px;
            }

            .download-progress progress::-webkit-progress-value {
                background-color: var(--download-progress-color);
                border-radius: 999px;
            }

            .download-segments {
                display: flex;
                gap: 1px;

                width: 100%;
                height: 4px;

                background-color: var(--download-progress-track-color);
                border: 1px solid rgba(0, 0, 0, 0.5);
                border-radius: 999px;
                overflow: hidden;
            }

            .download-segment {
                background-color: var(--download-progress-track-color);
            }

            .download-segment-fill {
                height: 100%;
                background-color: var(--download-progress-color);
            }

            .download-segment.complete .download-segment-fill {
                background-color: var(--download-segment-done-color);
            }

            .download-actions {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;

                min-width: 130px;
            }

            .download-actions button {
                white-space: nowrap;
                padding: 6px 10px;
                font-size: 12px;
                text-align: center;
            }

            @media (max-width: 860px) {
                .downloads-manager {
                    flex-direction: column;
                }

                .downloads-sidebar {
                    flex-direction: row;
                    flex-wrap: wrap;
                    flex-basis: auto;
                    width: 100%;
                }

                .downloads-header {
                    align-items: flex-start;
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <picture>
                <source srcset="resource://icons/128x128/app-browser.png" media="(prefers-color-scheme: dark)" />
                <img src="resource://icons/128x128/app-browser-dark.png" />
            </picture>
            <h1>Downloads</h1>
        </header>

        <div class="card">
            <div class="card-body downloads-content downloads-manager">
                <aside class="downloads-sidebar">
                    <div class="sidebar-section" id="status-filters" data-filter-group="status">
                        <h2 class="sidebar-heading">Status</h2>
                        <button class="sidebar-item active" data-filter-value="all">
                            <span>All</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="unfinished">
                            <span>Unfinished</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="finished">
                            <span>Finished</span><span class="sidebar-count"></span>
                        </button>
                    </div>
                    <div class="sidebar-section" id="category-filters" data-filter-group="category">
                        <h2 class="sidebar-heading">Categories</h2>
                        <button class="sidebar-item active" data-filter-value="all">
                            <span>All</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="compressed">
                            <span>Compressed</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="documents">
                            <span>Documents</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="music">
                            <span>Music</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="programs">
                            <span>Programs</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="video">
                            <span>Video</span><span class="sidebar-count"></span>
                        </button>
                        <button class="sidebar-item" data-filter-value="other">
                            <span>Other</span><span class="sidebar-count"></span>
                        </button>
                    </div>
                </aside>

                <section class="downloads-main">
                    <div class="downloads-header">
                        <div id="downloads-status" class="downloads-status">Loading downloads...</div>
                        <button id="prune-inactive-downloads" class="secondary-button" disabled>
                            Clear completed downloads
                        </button>
                    </div>
                    <div id="downloads-empty" class="downloads-empty hidden"></div>
                    <div class="downloads-table-wrapper">
                        <table class="downloads-table" id="downloads-table">
                            <thead>
                                <tr>
                                    <th class="col-name" data-sort="name">File Name</th>
                                    <th class="col-size" data-sort="size">Size</th>
                                    <th class="col-last-try" data-sort="lastTry">Last Try Date</th>
                                    <th class="col-date-added" data-sort="dateAdded">Date Added</th>
                                    <th class="col-location" data-sort="location">File Location</th>
                                    <th class="col-actions"></th>
                                </tr>
                            </thead>
                            <tbody id="downloads-list"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>

        <script type="module">
            const downloadsStatus = document.querySelector("#downloads-status");
            const downloadsEmpty = document.querySelector("#downloads-empty");
            const downloadsList = document.querySelector("#downloads-list");
            const downloadsTable = document.querySelector("#downloads-table");
            const pruneInactiveDownloadsButton = document.querySelector("#prune-inactive-downloads");

            const sizeFormatter = new Intl.NumberFormat([], {
                maximumFractionDigits: 1,
            });
            const dateFormatter = new Intl.DateTimeFormat([], {
                dateStyle: "short",
                timeStyle: "short",
            });
            const sizeUnits = [
                { divisor: 1, suffix: "B" },
                { divisor: 1024, suffix: "KiB" },
                { divisor: 1024 ** 2, suffix: "MiB" },
                { divisor: 1024 ** 3, suffix: "GiB" },
                { divisor: 1024 ** 4, suffix: "TiB" },
            ];

            // Categorization is intentionally simple (extension-based) and entirely client-side.
            const CATEGORY_EXTENSIONS = {
                compressed: ["zip", "rar", "7z", "tar", "gz", "tgz", "bz2", "tbz2", "xz", "txz", "zst", "cab", "iso"],
                documents: [
                    "pdf",
                    "doc",
                    "docx",
                    "odt",
                    "txt",
                    "rtf",
                    "xls",
                    "xlsx",
                    "ods",
                    "ppt",
                    "pptx",
                    "odp",
                    "csv",
                    "epub",
                    "md",
                ],
                music: ["mp3", "wav", "flac", "aac", "ogg", "oga", "m4a", "wma", "opus"],
                programs: ["exe", "msi", "dmg", "pkg", "deb", "rpm", "appimage", "apk", "sh", "bat", "run", "jar"],
                video: ["mp4", "mkv", "avi", "mov", "webm", "flv", "wmv", "m4v", "mpg", "mpeg", "3gp"],
            };

            function categoryForFileName(fileName) {
                const dot = fileName.lastIndexOf(".");
                if (dot <= 0 || dot === fileName.length - 1) return "other";

                const extension = fileName.slice(dot + 1).toLowerCase();
                for (const [category, extensions] of Object.entries(CATEGORY_EXTENSIONS)) {
                    if (extensions.includes(extension)) return category;
                }
                return "other";
            }

            function locationForDestination(destination) {
                const separator = destination.lastIndexOf("/") > -1 ? "/" : "\\";
                const index = destination.lastIndexOf(separator);
                return index > -1 ? destination.slice(0, index) : destination;
            }

            function isUnfinished(download) {
                return (
                    download.status === "in-progress" || download.status === "paused" || download.status === "failed"
                );
            }

            let downloads = [];
            const downloadRows = new Map();

            let statusFilter = "all";
            let categoryFilter = "all";
            let sortKey = "dateAdded";
            let sortDirection = "descending";

            function createElement(tagName, properties = {}, children = []) {
                const element = document.createElement(tagName);
                Object.assign(element, properties);
                element.append(...children);
                return element;
            }

            function pluralize(count, singular, plural = `${singular}s`) {
                return `${count} ${count === 1 ? singular : plural}`;
            }

            function unitForDownloadSize(size) {
                for (let i = sizeUnits.length - 1; i > 0; --i) {
                    if (size >= sizeUnits[i].divisor) return sizeUnits[i];
                }
                return sizeUnits[0];
            }

            function sizeLabel(size) {
                const unit = unitForDownloadSize(size);
                return `${sizeFormatter.format(size / unit.divisor)} ${unit.suffix}`;
            }

            function rateLabel(bytesPerSecond) {
                return `${sizeLabel(bytesPerSecond)}/s`;
            }

            function timeRemainingLabel(seconds) {
                if (seconds < 60) return `${Math.max(seconds, 1)} sec left`;

                const totalMinutes = Math.ceil(seconds / 60);
                if (totalMinutes < 60) return `${totalMinutes} min left`;

                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                return `${hours} hr ${minutes} min left`;
            }

            function dateLabel(milliseconds) {
                if (!milliseconds && milliseconds !== 0) return "";
                return dateFormatter.format(new Date(milliseconds));
            }

            function statusLabel(download) {
                if (download.status === "completed") return "Completed";
                if (download.status === "failed") return "Failed";
                if (download.status === "paused") return "Paused";
                return "Downloading";
            }

            function detailLabel(download) {
                if (download.status === "failed") return download.error || "The download failed.";
                if (download.status === "paused" && download.error) return download.error;
                if (download.status === "in-progress" && download.isWaitingToRetry)
                    return "The server asked us to slow down - waiting to retry.";
                if (download.status === "in-progress" || download.status === "paused") {
                    const parts = [];
                    if (download.status === "in-progress") {
                        if (download.bytesPerSecond > 0) parts.push(rateLabel(download.bytesPerSecond));
                        if (download.secondsRemaining !== null && download.secondsRemaining !== undefined)
                            parts.push(timeRemainingLabel(download.secondsRemaining));
                        if (download.connectionCount > 1) parts.push(`${download.connectionCount} connections`);
                    }
                    return parts.join(" - ");
                }
                return "";
            }

            function sizeCellLabel(download) {
                if (download.totalSize) {
                    if (download.status === "in-progress" || download.status === "paused") {
                        return `${sizeLabel(download.downloadedSize)} / ${sizeLabel(download.totalSize)}`;
                    }
                    return sizeLabel(download.totalSize);
                }
                if (download.downloadedSize) return sizeLabel(download.downloadedSize);
                return "-";
            }

            function createActionButton(className, textContent, message, downloadId) {
                return createElement("button", {
                    className,
                    textContent,
                    onclick: () => ladybird.sendMessage(message, { id: downloadId }),
                });
            }

            function actionsForDownload(download) {
                if (download.status === "in-progress") {
                    const buttons = [];
                    if (download.canResume)
                        buttons.push(createActionButton("secondary-button", "Pause", "pauseDownload", download.id));
                    buttons.push(createActionButton("secondary-button", "Cancel", "cancelDownload", download.id));
                    return buttons;
                }

                if (download.status === "paused") {
                    return [
                        createActionButton("primary-button", "Resume", "resumeDownload", download.id),
                        createActionButton("secondary-button", "Cancel", "cancelDownload", download.id),
                    ];
                }

                if (download.status === "failed") {
                    return [
                        createActionButton("primary-button", "Retry", "retryDownload", download.id),
                        createActionButton("secondary-button", "Remove", "removeDownload", download.id),
                    ];
                }

                if (download.status === "completed") {
                    return [
                        createActionButton("primary-button", "Open", "openDownload", download.id),
                        createActionButton("secondary-button", "Show in folder", "showDownloadInFolder", download.id),
                        createActionButton("secondary-button", "Remove", "removeDownload", download.id),
                    ];
                }

                return [];
            }

            function updateSegments(segments, download) {
                const downloadSegments = download.segments || [];
                if (downloadSegments.length < 2) {
                    segments.hidden = true;
                    segments.replaceChildren();
                    return;
                }

                segments.hidden = false;

                if (segments.children.length !== downloadSegments.length) {
                    segments.replaceChildren(
                        ...downloadSegments.map(() =>
                            createElement("div", { className: "download-segment" }, [
                                createElement("div", { className: "download-segment-fill" }),
                            ])
                        )
                    );
                }

                downloadSegments.forEach((segment, index) => {
                    const size = segment.end - segment.start + 1;
                    const downloaded = Math.min(Math.max(segment.next - segment.start, 0), size);

                    const block = segments.children[index];
                    block.style.flexGrow = `${size}`;
                    block.classList.toggle("complete", downloaded >= size);
                    block.firstChild.style.width = `${(downloaded / size) * 100}%`;
                });
            }

            function createDownloadRow(download) {
                const row = createElement("tr", { className: "download-row" }, [
                    createElement("td", { className: "col-name" }, [
                        createElement("div", { className: "download-name" }),
                        createElement("div", { className: "download-status-line" }, [
                            createElement("span", { className: "download-status" }),
                            createElement("span", { className: "download-detail" }),
                        ]),
                        createElement("div", { className: "download-progress" }, [
                            createElement("progress"),
                            createElement("div", { className: "download-segments" }),
                        ]),
                    ]),
                    createElement("td", { className: "col-size cell-text" }),
                    createElement("td", { className: "col-last-try cell-text" }),
                    createElement("td", { className: "col-date-added cell-text" }),
                    createElement("td", { className: "col-location cell-text" }),
                    createElement("td", { className: "col-actions" }, [
                        createElement("div", { className: "download-actions" }),
                    ]),
                ]);

                updateDownloadRow(row, download);
                return row;
            }

            function updateDownloadRow(row, download) {
                const name = row.querySelector(".download-name");
                name.textContent = download.fileName;
                name.title = download.fileName;

                const status = row.querySelector(".download-status");
                status.className = `download-status ${download.status}`;
                status.textContent = statusLabel(download);

                row.querySelector(".download-detail").textContent = detailLabel(download);

                const progress = row.querySelector("progress");
                const showProgress =
                    (download.status === "in-progress" || download.status === "paused") &&
                    download.totalSize !== null &&
                    download.totalSize !== undefined &&
                    download.totalSize !== 0;
                row.querySelector(".download-progress").hidden = !showProgress;
                progress.hidden = !showProgress;
                if (showProgress) {
                    progress.max = download.totalSize;
                    progress.value = Math.min(download.downloadedSize, download.totalSize);
                }
                updateSegments(row.querySelector(".download-segments"), download);

                const sizeCell = row.querySelector(".col-size");
                sizeCell.textContent = sizeCellLabel(download);
                sizeCell.title = sizeCell.textContent;

                const lastTryCell = row.querySelector(".col-last-try");
                lastTryCell.textContent = dateLabel(download.lastTryTime);
                lastTryCell.title = lastTryCell.textContent;

                const dateAddedCell = row.querySelector(".col-date-added");
                dateAddedCell.textContent = dateLabel(download.createdTime);
                dateAddedCell.title = dateAddedCell.textContent;

                const location = locationForDestination(download.destination);
                const locationCell = row.querySelector(".col-location");
                locationCell.textContent = location;
                locationCell.title = download.destination;

                const actionsId = `${download.status}:${download.canResume === true}`;
                const actions = row.querySelector(".download-actions");
                if (actions.dataset.actionsId !== actionsId) {
                    actions.dataset.actionsId = actionsId;
                    actions.replaceChildren(...actionsForDownload(download));
                }
            }

            function matchesStatusFilter(download, filter) {
                if (filter === "all") return true;
                if (filter === "unfinished") return isUnfinished(download);
                if (filter === "finished") return download.status === "completed";
                return true;
            }

            function matchesCategoryFilter(download, filter) {
                if (filter === "all") return true;
                return categoryForFileName(download.fileName) === filter;
            }

            function compareDownloads(a, b) {
                let result = 0;
                switch (sortKey) {
                    case "name":
                        result = a.fileName.localeCompare(b.fileName);
                        break;
                    case "size":
                        result = (a.totalSize || a.downloadedSize || 0) - (b.totalSize || b.downloadedSize || 0);
                        break;
                    case "lastTry":
                        result = (a.lastTryTime || 0) - (b.lastTryTime || 0);
                        break;
                    case "location":
                        result = locationForDestination(a.destination).localeCompare(
                            locationForDestination(b.destination)
                        );
                        break;
                    case "dateAdded":
                    default:
                        result = (a.createdTime || 0) - (b.createdTime || 0);
                        break;
                }
                return sortDirection === "ascending" ? result : -result;
            }

            function updateSidebarCounts() {
                const statusCounts = { all: downloads.length, unfinished: 0, finished: 0 };
                const categoryCounts = { all: downloads.length };
                for (const category of Object.keys(CATEGORY_EXTENSIONS)) categoryCounts[category] = 0;
                categoryCounts.other = 0;

                for (const download of downloads) {
                    if (isUnfinished(download)) ++statusCounts.unfinished;
                    else if (download.status === "completed") ++statusCounts.finished;

                    ++categoryCounts[categoryForFileName(download.fileName)];
                }

                for (const item of document.querySelectorAll("#status-filters .sidebar-item")) {
                    item.querySelector(".sidebar-count").textContent = statusCounts[item.dataset.filterValue] ?? 0;
                    item.classList.toggle("active", item.dataset.filterValue === statusFilter);
                }
                for (const item of document.querySelectorAll("#category-filters .sidebar-item")) {
                    item.querySelector(".sidebar-count").textContent = categoryCounts[item.dataset.filterValue] ?? 0;
                    item.classList.toggle("active", item.dataset.filterValue === categoryFilter);
                }
            }

            function updateSortHeaders() {
                for (const header of downloadsTable.querySelectorAll("th[data-sort]")) {
                    const isSorted = header.dataset.sort === sortKey;
                    header.classList.toggle("sorted", isSorted);
                    header.classList.toggle("descending", isSorted && sortDirection === "descending");
                }
            }

            function render() {
                const filteredDownloads = downloads.filter(
                    download =>
                        matchesStatusFilter(download, statusFilter) && matchesCategoryFilter(download, categoryFilter)
                );
                const sortedDownloads = [...filteredDownloads].sort(compareDownloads);

                const visibleIds = new Set(sortedDownloads.map(download => download.id));
                for (const [id] of downloadRows) {
                    if (!visibleIds.has(id)) downloadRows.delete(id);
                }

                const rows = sortedDownloads.map(download => {
                    let row = downloadRows.get(download.id);
                    if (!row) {
                        row = createDownloadRow(download);
                        downloadRows.set(download.id, row);
                    } else {
                        updateDownloadRow(row, download);
                    }
                    return row;
                });

                rows.forEach((row, index) => {
                    if (downloadsList.children[index] !== row)
                        downloadsList.insertBefore(row, downloadsList.children[index] || null);
                });
                while (downloadsList.children.length > rows.length) downloadsList.lastChild.remove();

                updateSidebarCounts();
                updateSortHeaders();

                const completedCount = downloads.filter(download => download.status === "completed").length;
                pruneInactiveDownloadsButton.disabled = completedCount === 0;

                const isEmpty = sortedDownloads.length === 0;
                downloadsTable.classList.toggle("hidden", isEmpty);
                downloadsEmpty.classList.toggle("hidden", !isEmpty);
                if (isEmpty) {
                    downloadsEmpty.textContent =
                        downloads.length === 0
                            ? "Your downloaded files will show up here."
                            : "No downloads match the current filters.";
                }

                const activeCount = downloads.filter(download => download.status === "in-progress").length;
                const pausedCount = downloads.filter(download => download.status === "paused").length;

                if (downloads.length === 0) {
                    downloadsStatus.textContent = "No downloads yet.";
                } else if (activeCount > 0) {
                    const paused = pausedCount > 0 ? `, ${pausedCount} paused` : "";
                    downloadsStatus.textContent = `${pluralize(activeCount, "active download")}${paused} - ${pluralize(downloads.length, "download")} total.`;
                } else if (pausedCount > 0) {
                    downloadsStatus.textContent = `${pluralize(pausedCount, "paused download")} - ${pluralize(downloads.length, "download")} total.`;
                } else {
                    downloadsStatus.textContent = pluralize(downloads.length, "download");
                }
            }

            function updateDownload(download) {
                const index = downloads.findIndex(candidate => candidate.id === download.id);
                if (index === -1) {
                    downloads.push(download);
                } else {
                    downloads[index] = download;
                }
                render();
            }

            function removeDownload(downloadId) {
                downloads = downloads.filter(download => download.id !== downloadId);
                downloadRows.delete(downloadId);
                render();
            }

            for (const group of document.querySelectorAll("[data-filter-group]")) {
                group.addEventListener("click", event => {
                    const item = event.target.closest(".sidebar-item");
                    if (!item) return;

                    if (group.dataset.filterGroup === "status") statusFilter = item.dataset.filterValue;
                    else categoryFilter = item.dataset.filterValue;

                    render();
                });
            }

            for (const header of downloadsTable.querySelectorAll("th[data-sort]")) {
                header.addEventListener("click", () => {
                    if (sortKey === header.dataset.sort) {
                        sortDirection = sortDirection === "ascending" ? "descending" : "ascending";
                    } else {
                        sortKey = header.dataset.sort;
                        sortDirection = "ascending";
                    }
                    render();
                });
            }

            pruneInactiveDownloadsButton.addEventListener("click", () => {
                ladybird.sendMessage("pruneInactiveDownloads");
            });

            document.addEventListener("WebUILoaded", () => {
                ladybird.sendMessage("loadDownloads");
            });

            document.addEventListener("WebUIMessage", event => {
                const { name, data } = event.detail;
                if (name === "loadDownloads") {
                    downloads = data;
                    render();
                } else if (name === "downloadAdded" || name === "downloadUpdated") {
                    updateDownload(data);
                } else if (name === "downloadRemoved") {
                    removeDownload(data);
                }
            });
        </script>
    </body>
</html>
